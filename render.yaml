services:
  - type: web
    name: devshowcase-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run render:build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devshowcase-postgres
          property: connectionString
      - key: PORT
        value: 3000
      - key: DISABLE_ERD
        value: "true"

databases:
  - name: devshowcase-postgres
    plan: free
    databaseName: devshowcase
    user: devshowcase_user
